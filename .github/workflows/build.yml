name: Derleme

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6.1
  GODOT_MINOR: "4.6"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, web ve APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Godot önbelleği
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VERSION }}

      - name: Godot ve dışa aktarma şablonlarını indir
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-dl && cd ~/godot-dl
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip && mv Godot_v*_linux.x86_64 godot && rm godot.zip
          unzip -q templates.tpz \
            'templates/version.txt' 'templates/web_nothreads_*' \
            'templates/android_debug.apk' 'templates/android_release.apk'
          rm templates.tpz

      - name: Godot kurulumu
        run: |
          sudo install -m 755 ~/godot-dl/godot /usr/local/bin/godot
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir" && cp ~/godot-dl/templates/* "$tdir/"
          keytool -genkeypair -keyalg RSA -keysize 2048 -validity 10000 \
            -alias androiddebugkey -keypass android -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -keystore "$HOME/debug.keystore"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_MINOR}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          godot --version

      - name: İçe aktar
        run: godot --headless --path . --import

      - name: Testler
        run: godot --headless --path . --script res://tests/run_tests.gd

      - name: Web çıktısı
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.wasm

      - name: Android APK (debug)
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug Android build/android/serbestkick-debug.apk
          test -s build/android/serbestkick-debug.apk

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: serbestkick-debug-apk
          path: build/android/serbestkick-debug.apk

      - name: Web çıktısını Pages için yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Web'i yayınla (GitHub Pages)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
